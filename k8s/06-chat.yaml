apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: zia
spec:
  # Socket.IO online-presence/active-conversation state and room/emit routing are backed by
  # Redis (see Chat/index.ts and Chat/src/utils/redis.ts), so this deployment is safe to run
  # with more than one replica.
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: zia/chat:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: chat-config
            - secretRef:
                name: chat-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: zia
spec:
  selector:
    app: chat
  ports:
    - port: 3001
      targetPort: 3001
