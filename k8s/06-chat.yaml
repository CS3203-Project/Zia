apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: zia
spec:
  # Socket.IO online-presence/active-conversation state is kept in-memory (see Chat/index.ts) —
  # keep this at 1 replica until a shared adapter (e.g. Redis) is added for multi-pod presence.
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: zia/chat:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: chat-config
            - secretRef:
                name: chat-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: zia
spec:
  selector:
    app: chat
  ports:
    - port: 3001
      targetPort: 3001
