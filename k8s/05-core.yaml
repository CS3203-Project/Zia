apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: zia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      containers:
        - name: core
          image: zia/core:dev
          imagePullPolicy: Never # locally built image, loaded into kind — see k8s/README.md
          ports:
            - containerPort: 3000
          # REDIS_URL and MINIO_* (incl. MINIO_ACCESS_KEY/MINIO_SECRET_KEY) come in
          # through these same envFrom refs — see core-config/core-secrets.
          envFrom:
            - configMapRef:
                name: core-config
            - secretRef:
                name: core-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: zia
spec:
  selector:
    app: core
  ports:
    - port: 3000
      targetPort: 3000
