# Single entry point, path-based routing. Requires the ingress-nginx controller
# (see k8s/README.md for the kind setup command). More specific paths
# (/api/payments, /api/admin/analytics) take precedence over the general /api
# catch-all — this is how ingress-nginx resolves overlapping prefixes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zia-ingress
  namespace: zia
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Required for the Chat service's Socket.IO connections to upgrade correctly.
    nginx.ingress.kubernetes.io/proxy-set-headers: "zia/websocket-headers"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 3002
          - path: /api/admin/analytics
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 3002
          - path: /messaging
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 3001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 3000
          # Uploaded images/videos now live in MinIO (zia-uploads bucket, made publicly
          # downloadable by the minio-createbuckets Job in 13-minio.yaml), not on Core's
          # local disk, so URLs route straight to MinIO's S3 API instead of Core. MinIO
          # already expects paths of the form /<bucket>/<key>, so "/zia-uploads" here
          # lines up with its own routing with no rewrite-target annotation needed — same
          # as how /api above passes straight through to core-service. Core builds
          # uploaded-file URLs as {MINIO_PUBLIC_URL}/zia-uploads/<key>
          # (Core/src/utils/s3.ts), so MINIO_PUBLIC_URL (01-configmaps.yaml) must be just
          # this ingress host with NO path suffix — the "/zia-uploads" comes from the
          # bucket name the app code appends, not from the config value itself.
          - path: /zia-uploads
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-headers
  namespace: zia
data:
  Upgrade: "$http_upgrade"
  Connection: "upgrade"
