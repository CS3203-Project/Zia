# Static build served by nginx — Vite bakes VITE_* variables in at `docker build` time
# (from Frontend/.env / .env.production), not at container runtime, so there's no envFrom
# here. Rebuild the image if API URLs change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: zia/frontend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: zia
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
