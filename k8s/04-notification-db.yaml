# Notification keeps its own separate Postgres, unchanged from before the core/chat/
# payment split — it was never part of the shared-schema decision. It used to also run
# its own separate RabbitMQ broker (rabbitmq-notification), but nothing published to
# that broker except itself — Core publishes to the shared "rabbitmq" broker
# (03-rabbitmq.yaml), so notification emails were queued on the Core side and never
# consumed. That separate broker's Deployment/Service/PVC have been removed here;
# notification-config's RABBITMQ_URL (01-configmaps.yaml) now points at the shared
# broker instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-notification-data
  namespace: zia
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-notification
  namespace: zia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-notification
  template:
    metadata:
      labels:
        app: postgres-notification
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: zia_com
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-notification-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-notification
  namespace: zia
spec:
  selector:
    app: postgres-notification
  ports:
    - port: 5432
      targetPort: 5432
