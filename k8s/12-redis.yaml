# Shared Redis instance — Chat's Socket.IO adapter + online-presence store (so presence
# works across multiple Chat pods), rate-limit counters (Core/Chat/Payment), and Core's
# geocode cache with TTL. Persists to disk (--appendonly yes) so presence/cache survive a
# restart. Unauthenticated, same as docker-compose — fine for this local/dev cluster; see
# k8s/README.md's "Known limitations" for the production gap.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: zia
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: zia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: zia
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
