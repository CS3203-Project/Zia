# Builds every image in CI, publishes them to GHCR, then tells the server to
# pull and restart.
#
# The server is deliberately not a build host: it has 954 MB of RAM and 2 vCPU,
# and `npm ci` plus a Vite build there would run it out of memory. CI does the
# heavy work; the box only pulls.
name: Deploy to production

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  # GHCR rejects any uppercase in a repository name, and the owner here is
  # "CS3203-Project". github.repository_owner preserves that casing, so it has
  # to be lowercased before it can be used in a tag.
  REGISTRY: ghcr.io/cs3203-project/zia

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One slow service shouldn't hide failures in the others.
      fail-fast: false
      matrix:
        include:
          - name: core
            context: ./Core
          - name: chat
            context: ./Chat
          - name: payment
            context: ./Payment
          - name: notification
            context: ./Notification
          - name: frontend
            context: ./Frontend
          - name: postgres
            context: ./scripts
            dockerfile: ./scripts/postgres-core.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          # Layer cache keyed per service, so one service's cache can't be
          # clobbered by another's.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # The repo is private, so its GHCR packages are too: the server needs a
      # credential to pull. The job's own GITHUB_TOKEN is used rather than a
      # long-lived PAT, so it expires when the run ends.
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,scripts/init-core-db.sql,Notification/scripts/init-notification-db.sql"
          target: "~/zia"

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Passed through so the heredoc below can write .env on the host.
          # Nothing here is ever written into the repository.
          REGISTRY: ghcr.io/cs3203-project/zia
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          # Pulling six images onto a 2-vCPU box and waiting for the stack to
          # come up runs past the action's default, which failed the run even
          # though every container had started.
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/zia

            # Written fresh each deploy, readable only by the deploy user.
            umask 077
            cat > .env <<ENVEOF
            REGISTRY=${REGISTRY}
            IMAGE_TAG=${IMAGE_TAG}
            APP_URL=${{ secrets.APP_URL }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            INTERNAL_API_KEY=${{ secrets.INTERNAL_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
            MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_USER=${{ secrets.MAIL_USER }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_PASS=${{ secrets.MAIL_PASS }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            PAYHERE_MODE=${{ secrets.PAYHERE_MODE }}
            PAYHERE_MERCHANT_ID=${{ secrets.PAYHERE_MERCHANT_ID }}
            PAYHERE_MERCHANT_SECRET=${{ secrets.PAYHERE_MERCHANT_SECRET }}
            PAYHERE_APP_ID=${{ secrets.PAYHERE_APP_ID }}
            PAYHERE_APP_SECRET=${{ secrets.PAYHERE_APP_SECRET }}
            ENVEOF

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Reclaim disk from superseded images; the box only has ~93 GB and
            # every deploy leaves another full set behind.
            docker image prune -af --filter "until=72h" || true

            # Apply schema migrations. Without this the containers start and
            # connect happily against an empty database, and every query 500s —
            # which is exactly how a deploy once reported success over a schema
            # with zero application tables.
            #
            # Order matters: a Core migration backfills bookings by selecting
            # from chat."Conversation", so Chat has to have created its schema
            # first or Core aborts on "relation does not exist". Payment is
            # independent.
            migrate() {
              svc=$1
              echo "migrating ${svc}..."
              for i in $(seq 1 20); do
                if docker compose -f docker-compose.prod.yml exec -T "$svc" npx prisma migrate deploy; then
                  return 0
                fi
                echo "  ${svc} not ready yet, retrying..."
                sleep 5
              done
              echo "${svc} migrations failed after 20 attempts" >&2
              return 1
            }

            migrate chat
            migrate payment
            migrate core

            # Seed service categories. seed.ts compiles to dist/prisma/seed.js,
            # so this runs on plain node with no dev dependencies. Every write is
            # an upsert, so re-running on each deploy is harmless — and it only
            # creates categories, never demo users or listings.
            echo "seeding categories..."
            seeded=""
            for i in $(seq 1 20); do
              if docker compose -f docker-compose.prod.yml exec -T core node dist/prisma/seed.js; then
                seeded=yes
                break
              fi
              echo "  core not ready yet, retrying..."
              sleep 5
            done
            # Previously the loop just fell through when every attempt failed, so
            # a completely unseeded database still reported a green deploy.
            if [ -z "$seeded" ]; then
              echo "category seed failed after 20 attempts" >&2
              exit 1
            fi

            docker compose -f docker-compose.prod.yml ps

      - name: Smoke test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            # Give the stack a moment before judging it.
            #
            # The API check is the point: serving the SPA shell only proves nginx
            # is up. A deploy once passed this step while every /api/services call
            # returned 500 against an empty schema, because the old check stopped
            # at the frontend. curl -f makes a 500 a failure.
            ok=""
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://localhost/ \
                 && curl -sf -o /dev/null http://localhost:3000/api/services; then
                ok=yes
                break
              fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "stack did not come up healthy within 150s" >&2
              cd ~/zia && docker compose -f docker-compose.prod.yml logs --tail=40
              exit 1
            fi
            echo "frontend and core API responding"
