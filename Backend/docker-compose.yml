version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zia-backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: zia-backend-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: zia_backend
    ports:
      - "5432:5432"
    volumes:
      - backend_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zia-backend-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - backend_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  backend_pg_data:
  backend_rabbitmq_data:
  backend_uploads:
