# Host nginx for zia.motionstack.org.
#
# Terminates TLS with the Cloudflare Origin certificate and routes to the
# containers. Each backend is published on loopback only, so nothing but nginx
# can reach them from outside the box.
#
# Install:
#   sudo cp nginx-production.conf /etc/nginx/sites-available/zia
#   sudo ln -sf /etc/nginx/sites-available/zia /etc/nginx/sites-enabled/zia
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream zia_frontend { server 127.0.0.1:8080; }
upstream zia_core     { server 127.0.0.1:3000; }
upstream zia_chat     { server 127.0.0.1:3001; }
upstream zia_payment  { server 127.0.0.1:3002; }
upstream zia_minio    { server 127.0.0.1:9000; }

server {
    listen 80;
    listen [::]:80;
    server_name zia.motionstack.org;

    # Cloudflare proxies in front of this, but a direct hit on :80 should still
    # end up on TLS rather than serving the app in the clear.
    return 301 https://$host$request_uri;
}

server {
    # `http2 on;` is nginx >= 1.25.1 only; the target runs 1.24, where HTTP/2 is
    # enabled as a listen parameter instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zia.motionstack.org;

    ssl_certificate     /etc/nginx/ssl/zia-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/zia-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Uploads: services accept images up to the admin-configured limit, and the
    # nginx default of 1 MB would reject them before they ever reached the app.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Real client IP. Cloudflare passes it in CF-Connecting-IP; without this the
    # services see nginx's address and every visitor shares one rate-limit
    # bucket (which is why TRUST_PROXY=1 is set on the containers).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PayHere posts its server-to-server callback here. It must stay reachable
    # without auth and without a redirect, or payments never settle.
    location /api/payments/notify {
        proxy_pass http://zia_payment;
    }

    location /api/payments/ { proxy_pass http://zia_payment; }
    location /api/admin/analytics/ { proxy_pass http://zia_payment; }

    location /messaging/ { proxy_pass http://zia_chat; }

    # Socket.IO needs the connection upgraded, otherwise it silently falls back
    # to long-polling and live updates lag.
    location /socket.io/ {
        proxy_pass http://zia_chat;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ { proxy_pass http://zia_core; }

    # Uploaded media.
    location /s3/ {
        proxy_pass http://zia_minio/;
        proxy_set_header Host $host;
    }

    # Everything else is the SPA.
    location / {
        proxy_pass http://zia_frontend;
    }
}
